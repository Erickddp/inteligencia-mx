[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "timbra-reglas"
dynamic = ["version"]  # = VERSION_MOTOR = version_base (lo exige tests/test_versiones.py)
description = "Base fiscal y contable de Timbra: parámetros de ley por fecha, reglas y motor"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
timbra-reglas = "timbra_reglas.motor:cli"

[tool.setuptools]
packages = ["timbra_reglas", "timbra_reglas.base"]

[tool.setuptools.package-dir]
timbra_reglas = "timbra_reglas"
"timbra_reglas.base" = "base"

[tool.setuptools.package-data]
"timbra_reglas.base" = ["parametros.yaml", "reglas.yaml"]

[tool.setuptools.dynamic]
version = {attr = "timbra_reglas.motor.VERSION_MOTOR"}

[tool.pytest.ini_options]
testpaths = ["tests"]
