# Índice de las NIF como REFERENCIA para la contabilidad de las apps.
#
# - Las NIF las publica el CINIF con derechos reservados: aquí NO se copia su texto. Solo el identificador, el título,
#   el tema y para qué se usan en las reglas de este repo.
# - Cotejo del 2026-11-13 contra lo que el CINIF publica sin suscripción (el listado completo y el libro NIF 2026 piden
#   cuenta de pago). `cotejado: true` + `cotejo: <clave de fuentes_cotejo>` = identificador y título leídos en un documento
#   del CINIF. `cotejado: false` = no apareció con su título exacto en esas fuentes públicas (los boletines de 2021, 2022, 2025 y 2026 son imágenes): sigue sin confirmar, aunque el título sea el usual.
# - Lo que el cotejo cambió: la NIF A-1 (Marco Conceptual) sustituyó desde 2023 a las A-1 a A-8 anteriores (van en `derogadas`),
#   la A-2 es otra norma desde 2026 (negocio en marcha) y la B-1 y la B-3 tienen versión nueva en el libro 2026.
# - Las reglas las citan así: citas: [{nif: "C-3"}]. Una NIF nunca fija un número de ley: sirve para justificar el
#   criterio contable (cómo se reconoce, se valúa o se presenta algo), no para producir cifras fiscales.
version: 2
cotejo: "2026-11-13"
fuente: "CINIF, Normas de Información Financiera (edición vigente); https://www.cinif.org.mx"
nota: "Referencia y resumen propio. Texto con derechos reservados del CINIF."
fuentes_cotejo:
  mejoras_2023: {titulo: "CINIF, Mejoras a las NIF 2023 (D.R. CINIF 2022)", url: "https://www.cinif.org.mx/assets/mejoras_nif/MejorasNIF2023.pdf", sha256: "51912a7d243ad33b60ce06b2e85c34cbaf9b30e5c06580210a7253caf7e281e2", leido: "2026-11-13"}
  aclaracion_2025: {titulo: "CINIF, Aclaración editorial al Libro NIF 2025 (28-mar-2025)", url: "https://www.cinif.org.mx/uploads/Libro_NIF_2025-Aclaracion_editorial.pdf", sha256: "b4f9126fcc7e7cb960259f0577dd35b4b579d0c4d28c65e7919475601d0d4a05", leido: "2026-11-13"}
  mejoras_2018: {titulo: "CINIF, Mejoras a las NIF 2018", url: "https://www.cinif.org.mx/assets/mejoras_nif/MejorasNIF2018.pdf", sha256: "5da05d76fd6eda360e616ad883819ea43e598a4cbf952a4d1e9f7bce7f48d47d", leido: "2026-11-14"}
  mejoras_2019: {titulo: "CINIF, Mejoras a las NIF 2019", url: "https://www.cinif.org.mx/assets/mejoras_nif/MejorasNIF2019.pdf", sha256: "6efb8317c909851be89d5689464b8785d441b91036c19e59441ff83eb470d3de", leido: "2026-11-14"}
  mejoras_2020: {titulo: "CINIF, Mejoras a las NIF 2020", url: "https://www.cinif.org.mx/assets/mejoras_nif/MejorasNIF2020.pdf", sha256: "e9e7633d10e47844fa423ffbdf7ba9faac8bd04e7936dd7e5ab21e28dfc1b76d", leido: "2026-11-14"}
  libro_2026: {titulo: "CINIF, Libro NIF 2026 (página del libro: NIF vigentes al 1-ene-2026, novedades B-1 y B-3)", url: "https://www.cinif.org.mx/info_libro2026.php", leido: "2026-11-13"}
