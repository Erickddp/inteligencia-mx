  - {id: "IAS 41", titulo: "Agricultura", tema: "activo", nif: "", diferencia: "La NIF equivalente (actividades agropecuarias) es de la serie E, que este índice aún no trae: POR CONFIRMAR", estado: por_confirmar, cotejado: false}
  - {id: "IFRS 1", titulo: "Adopción por primera vez de las NIIF", tema: "adopción", nif: "", diferencia: "Sin equivalente directo: aplica a quien pasa a NIIF", estado: vigente, cotejado: false}
  - {id: "IFRS 2", titulo: "Pagos basados en acciones", tema: "resultados", nif: "", diferencia: "Sin equivalente directo en el índice de NIF: POR CONFIRMAR", estado: por_confirmar, cotejado: false}
  - {id: "IFRS 3", titulo: "Combinaciones de negocios", tema: "estados financieros", nif: "B-7", diferencia: "Equivalentes en lo esencial (método de adquisición)", estado: vigente, cotejado: false}
