  - {iso: SON, nombre: Sonora, alias: []}
  - {iso: TAB, nombre: Tabasco, alias: []}
  - {iso: TAM, nombre: Tamaulipas, alias: []}
  - {iso: TLA, nombre: Tlaxcala, alias: []}
