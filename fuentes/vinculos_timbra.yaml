# Vínculos entre los rubros de nómina y de estados financieros que usa Timbra y lo que ya tiene esta base.
#
# - `nomina`: cada rubro apunta a los artículos de la biblioteca que lo fundamentan (LFT, LSS, Ley del Infonavit, LISR), a los parámetros
#   que Timbra ya carga y a las reglas que los usan. Los artículos y parámetros se comprueban con pruebas contra fuentes/leyes/ y base/.
#   Es un mapa de lectura: no cambia ninguna cifra y no es una cita firmada (los textos siguen sin cotejar con el DOF).
# - `estados_financieros`: cada rubro apunta a la NIF indexada que lo trata y a las reglas de la base que ya la citan. NO se carga texto
#   de las NIF (derechos reservados del CINIF); `cotejado` repite lo que dice fuentes/nif/indice.yaml.
# - Pedido de Timbra del 2026-11-24. Las reglas se calcularon al generar el archivo; la prueba comprueba que existan.
version: 1
generado: "2026-11-24"
nomina:
  - rubro: aguinaldo
    nombre: "Aguinaldo (anual y proporcional) y su exención"
    citas: [{ley: LFT, articulo: "87"}, {ley: LISR, articulo: "93"}]
    parametros: [LFT_AGUINALDO_DIAS, EXENTO_AGUINALDO_VECES_UMA, EXENTO_AGUINALDO_IMPORTE]
    reglas: [R-83, R-125, R-126, R-130]
