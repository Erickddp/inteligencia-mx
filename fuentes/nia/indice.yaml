# Índice de las NIA (Normas Internacionales de Auditoría) como REFERENCIA: identificador, título, tema y para qué sirven.
#
# - Las NIA las emite el IAASB (IFAC) y en México las difunde el IMCP con derechos reservados: aquí NO se copia su texto, sólo
#   identificador, título (traducción de uso común) y un resumen propio de una línea.
# - NINGUNA está cotejada (`cotejado: false`): ni el sitio del IMCP ni el del IAASB se pudieron abrir desde el entorno de trabajo del
#   2026-11-23. Los números y títulos son los de uso común; falta cotejarlos con la edición vigente del IMCP, y también cuáles NIA se
#   renumeraron o sustituyeron (por ejemplo la NIA 220 revisada y las normas de control de calidad NICC 1 y 2, que no se cargan).
# - Ninguna NIA fija un número de ley: sirven de criterio profesional de auditoría. Lo único leído en la biblioteca: el dictamen fiscal
#   exige al contador público inscrito cumplir «las normas de auditoría vigentes a la fecha de presentación del dictamen» (RCFF art. 60,
#   para los efectos del CFF art. 52 fr. II). Los textos no dicen cuáles son esas normas; que sean las NIA del IMCP es lo usual y NO está cotejado.
version: 1
cotejo: null
fuente: "IAASB, Normas Internacionales de Auditoría; edición en español del IMCP (https://www.imcp.org.mx)"
nota: "Referencia y resumen propio. Texto con derechos reservados."
pendientes:
  - "Cotejar identificador y título de cada NIA contra la edición vigente del IMCP."
  - "NICC 1 y NICC 2 (control de calidad de firmas) y las demás normas del IAASB (ISRE, ISAE, ISRS): no se cargan."
  - "Confirmar con el IMCP y el SAT qué normas de auditoría son «las vigentes» para el RCFF art. 60 (el texto no las nombra)."
