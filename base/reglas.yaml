  - id: R-169
    nombre: "IVA de los servicios médicos: exento o gravado"
    estado: NUEVA
    fase: 3
    parametros: [IVA_EXENTO_PROFESIONES_MEDICAS, IVA_EXENTO_PRESTADORES_MEDICOS]
    calculadora: iva_servicio_medico
    fuente: "LIVA art. 15 fr. XIV; RLIVA art. 41 (texto de la Cámara, sin cotejar con el DOF)"
    citas: [{ley: LIVA, articulo: "15"}, {ley: RLIVA, articulo: "41"}]
    que_dice: "Los servicios profesionales de medicina están exentos de IVA solo cuando los presta un médico, médico veterinario o cirujano dentista que persona física, por sí mismo o por conducto de una sociedad civil o de una institución de asistencia privada; lo demás causa IVA."
    correcto_si: "El servicio es un servicio profesional de medicina que requiere título; quien lo presta es persona física, sociedad civil o institución de asistencia o beneficencia privada autorizada (no una sociedad mercantil); y cada servicio se clasifica por separado."
    hallazgo: "La ley no trae un reparto porcentual fijo (como 75/25) entre lo exento y lo gravado: clasifica cada servicio. Un reparto solo tiene sustento si resulta de sumar conceptos clasificados uno por uno; si la app ve un porcentaje fijo sin conceptos, debe AVISAR que no tiene sustento. Qué servicios de una clínica entran en la fracción XIV (estéticos, medicamentos aplicados, materiales, hospitalización) NO lo define el texto de la ley ni del reglamento en la biblioteca: la calculadora los trata como gravados salvo que sean servicios de las tres profesiones, y esa clasificación fina es criterio de contador. Los servicios hospitalarios de organismos públicos (fr. XV) no están modelados."
    casos:
      - {nombre: "Médico persona física: exento", fecha: "2026-06-30", entradas: {profesion: medico, prestador: persona_fisica}, esperado: {tratamiento: exento, fundamento: "LIVA 15 fr. XIV; RLIVA 41"}}
      - {nombre: "Cirujano dentista por conducto de una sociedad civil: exento", fecha: "2026-06-30", entradas: {profesion: cirujano_dentista, prestador: sociedad_civil}, esperado: {tratamiento: exento, fundamento: "LIVA 15 fr. XIV; RLIVA 41"}}
      - {nombre: "Veterinario por una institución de asistencia privada: exento", fecha: "2026-06-30", entradas: {profesion: medico_veterinario, prestador: institucion_asistencia_privada}, esperado: {tratamiento: exento, fundamento: "LIVA 15 fr. XIV; RLIVA 41"}}
      - {nombre: "Médico por conducto de una sociedad mercantil: gravado", fecha: "2026-06-30", entradas: {profesion: medico, prestador: sociedad_mercantil}, esperado: {tratamiento: gravado, fundamento: "fuera de LIVA 15 fr. XIV: causa IVA salvo que otra fracción lo exente"}}
      - {nombre: "Servicio que no es de un médico (por ejemplo estético): gravado", fecha: "2026-06-30", entradas: {profesion: otra, prestador: persona_fisica}, esperado: {tratamiento: gravado, fundamento: "fuera de LIVA 15 fr. XIV: causa IVA salvo que otra fracción lo exente"}}
  - id: R-170
