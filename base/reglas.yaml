    que_dice: "En el RESICO de personas morales el pago provisional sale de lo cobrado menos lo pagado, acumulado desde enero, con la tasa de las personas morales; después se acreditan los provisionales anteriores y las retenciones."
    correcto_si: "Cobrado y pagado son acumulados desde el inicio del ejercicio, se resta la PTU pagada y las pérdidas anteriores, la tasa es la del art. 9 y se acreditan los pagos provisionales del mismo ejercicio y las retenciones del periodo."
    hallazgo: "Fundamento verificado en LISR 211 (pago provisional: ingresos efectivamente percibidos menos deducciones efectivamente erogadas y PTU pagada, desde el inicio del ejercicio, por la tasa del art. 9). El tope de ingresos del ejercicio anterior (LISR 206) es RESICO_PM_TOPE_ANUAL. La calculadora recibe cobrado y pagado ya acumulados."
