    parametros: [IVA_EXENTO_PROFESIONES_MEDICAS]
    calculadora: iva_acreditable_destino
    fuente: "LIVA art. 5 fr. V incisos a), b), c) y d) numeral 3; arts. 4-A, 5-A, 5-C y 15 fr. XIV"
    citas: [{ley: LIVA, articulo: "5", fraccion: "V"}, {ley: LIVA, articulo: "4-a"}, {ley: LIVA, articulo: "5-a"}, {ley: LIVA, articulo: "5-c"}, {ley: LIVA, articulo: "15"}]
    que_dice: "Si haces actividades gravadas y exentas a la vez, el IVA de cada gasto se acredita según para qué lo usas: todo si es sólo para lo gravado (16 % o 0 %), nada si es sólo para lo exento, y en proporción si sirve para las dos."
    correcto_si: "Cada gasto se clasifica por destino; el IVA indistinto (gastos e inversiones) se multiplica por (actos al 16 % + al 0 %) / (todos los actos del mes, con los no objeto del 4-A); lo exclusivo de exentos no se acredita y es gasto."
    hallazgo: "Consultorio médico: las consultas de médico con título son exentas (LIVA 15 fr. XIV); lo que vende de producto va al 16 %, y medicinas de patente al 0 %, que también cuenta como gravado. El IVA no acreditable se vuelve costo o gasto para ISR. Inversiones indistintas (inciso d-3): misma proporción del mes, con el ajuste del art. 5-A en los meses siguientes, que aquí NO se calcula (POR CONFIRMAR, va con R-17 y la opción del art. 5-B). Fuera de los valores, lo del art. 5-C (ventas de activo fijo, intereses, acciones, moneda, etc.)."
