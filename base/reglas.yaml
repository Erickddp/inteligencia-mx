  - id: R-109
    nombre: Matriz régimen × obligación
    estado: NUEVA
    fase: 3
    parametros: [CONTA_ELEC_RELEVO_PF_INGRESOS, ARREND_TRIMESTRAL_VECES_UMA, UMA_MENSUAL]
    hallazgo: "601 provisional con CU (devengado), 603 informativa 15-feb, 606 mensual o trimestral (≤10 UMA mensuales), 612 acumulada, 621 bimestral residual, 625 retención, 626 PF definitivo, 626 PM flujo × 30%, 616 solo receptor. 606/612 con ingresos ≤4 M del año anterior: sin contabilidad electrónica ni DIOT (2.8.1.17). RESICO PM: relevado en 2026 (regla 3.13.x POR CONFIRMAR). Si falta el ingreso del año anterior: sin relevo + aviso."

  - id: R-110
    nombre: Provisional 612 (enero = tarifa mensual)
    citas: [{ley: LISR, articulo: "106"}]
    que_dice: "En el 612, el pago provisional parte de lo cobrado acumulado, resta lo que la ley permite y aplica la tarifa del mes."
    correcto_si: "Enero usa la tarifa mensual; de febrero en adelante, la tabla acumulada oficial (R-20); la base ya resta deducciones pagadas, depreciación proporcional, PTU pagada y pérdidas."
    estado: NUEVA
    fase: 3
    parametros: [ISR_TARIFA_MENSUAL]
    calculadora: isr_tarifa
    hallazgo: "Base = cobrado acumulado − deducciones pagadas − depreciación proporcional − PTU pagada − pérdidas. Febrero a noviembre: tabla acumulada OFICIAL del Anexo 8 (R-20), no la mensual × meses."
    casos:
      - {nombre: "Enero, base 20,000", fecha: "2026-01-31", entradas: {tabla: ISR_TARIFA_MENSUAL, base: "20000.00"}, esperado: "2383.65"}
      - {nombre: "Enero, base en el límite 844.59", fecha: "2026-01-31", entradas: {tabla: ISR_TARIFA_MENSUAL, base: "844.59"}, esperado: "16.22"}

  - id: R-111
    nombre: Provisional 606 con ciega y predial
    citas: [{ley: LISR, articulo: "115"}, {ley: LISR, articulo: "116"}]
    que_dice: "En arrendamiento puedes deducir lo que paga la ley o la deducción opcional (ciega) del predial y de los ingresos, y sobre el resto se paga con la tarifa."
    correcto_si: "El pago provisional mensual usa la tarifa mensual y el trimestral la tarifa trimestral oficial; la deducción opcional sustituye a las demás deducciones y el predial pagado se resta además; la retención de la persona moral se acredita."
    estado: NUEVA
    fase: 3
    parametros: [ARREND_DEDUCCION_CIEGA_PCT, ISR_TARIFA_MENSUAL]
    calculadora: isr_606
    hallazgo: "Mensual: tarifa MENSUAL (no acumulada). Trimestral: tarifa oficial ISR_TARIFA_TRIMESTRAL_ARRENDAMIENTO (Anexo 8 2026). Según LISR 116 se puede pagar por trimestre solo quien únicamente tenga ingresos por arrendamiento y una renta mensual de hasta diez salarios mínimos elevados al mes (el texto sigue diciendo salarios mínimos; se entiende UMA, ARREND_TRIMESTRAL_VECES_UMA): la calculadora no lo valida, lo valida la app. LISR 115 dice que el 35 % es una opción EN SUBSTITUCIÓN de las demás deducciones, y que quien la ejerce puede deducir además el predial: no dice que pueda elegirse la mayor de las dos cada mes, así que usar lo mayor entre ciega y gastos reales es un criterio que decide el contador, no la ley. La retención de 10 % que hace una persona moral se acredita contra el pago provisional (LISR 116)."
    casos:
      - {nombre: "Trimestre: rentas 60,000 ciega", fecha: "2026-03-31", entradas: {ingresos: "60000.00", trimestral: true}, esperado: "3227.99"}
      - {nombre: "Renta 20,000 ciega", fecha: "2026-03-31", entradas: {ingresos: "20000.00"}, esperado: "1076.00"}
      - {nombre: "Renta 20,000 ciega + predial 1,200", fecha: "2026-03-31", entradas: {ingresos: "20000.00", predial: "1200.00"}, esperado: "924.86"}

