    estado: NUEVA
    fase: 3
    parametros: [RESICO_PF_RETENCION_PM]
    calculadora: retencion_resico_pf
    fuente: "LISR art. 113-J y 113-E; RMF 2026 regla 2.7.1.45 (texto de la Cámara y del DOF, sin cotejar)"
    citas: [{ley: LISR, articulo: "113-j"}, {ley: LISR, articulo: "113-e"}, {ley: RMF, anio: "2026", articulo: "2.7.1.45"}]
    que_dice: "Cuando una persona física en RESICO factura a una persona moral, esta le retiene el 1.25 % del pago, sin contar el IVA, y lo entera a más tardar el día 17 del mes siguiente."
    correcto_si: "La retención aplica solo si quien paga es persona moral y se calcula sobre el pago sin IVA; a una persona física o al público en general (RFC genérico) no se retiene; el impuesto retenido se considera en el pago mensual del RESICO."
    hallazgo: "Confirma tus dos supuestos con el texto del art. 113-J: SÍ aplica a la factura nominativa a una persona moral, y NO a la global al público en general, porque ahí el receptor no es persona moral (el RFC genérico XAXX010101000 define al público en general, RMF 2.7.1.45). El artículo no tiene fecha de término (adicionado DOF 12-nov-2021): sigue vigente en 2026, aunque el texto de la Cámara no está cotejado con el DOF."
    casos:
      - {nombre: "Pago de 10,000 sin IVA de una persona moral: retiene 125.00", fecha: "2026-06-30", entradas: {monto: "10000", receptor: persona_moral}, esperado: "125.00"}
      - {nombre: "El pagador es una persona física: no retiene", fecha: "2026-06-30", entradas: {monto: "10000", receptor: persona_fisica}, esperado: "0.00"}
      - {nombre: "Factura global al público en general: no retiene", fecha: "2026-06-30", entradas: {monto: "10000", receptor: publico_en_general}, esperado: "0.00"}
