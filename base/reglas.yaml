  # ───────────── G. Pólizas tipo: evento → cargos y abonos por concepto ─────────────
  # Criterio contable, no cifras de ley. Los conceptos son nombres estables (no números de cuenta): cada app los apunta a
  # su catálogo, idealmente al código agrupador del SAT. Toda póliza cuadra o la calculadora falla. Sin firma de Rick.
  - id: R-150
    nombre: "Póliza tipo: CFDI emitido (clientes, ingreso por tasa, IVA trasladado no cobrado)"
    estado: CRITERIO
    fase: 4
    calculadora: poliza_emitido
    fuente: "CFF art. 28; RCFF art. 33; LIVA art. 1-B; NIF D-1 y C-3 (referencia)"
    citas: [{ley: CFF, articulo: "28"}, {ley: RCFF, articulo: "33"}, {ley: LIVA, articulo: "1-b"}, {nif: "D-1"}, {nif: "C-3"}]
    que_dice: "Al emitir una factura, el cliente te debe lo que te va a pagar (total menos lo que te retienen); el ingreso va por tasa y el IVA queda como trasladado hasta que cobres."
    correcto_si: "La póliza cuadra, el ingreso se separa en gravado, tasa 0 y exento, y el IVA se reconoce como cobrado hasta el cobro."
    hallazgo: "Retenciones que me hicieron: cargo a ISR retenido por clientes y a IVA retenido por clientes; el cargo a clientes es el total del CFDI, que ya viene neto de ellas."
    casos:
      - {nombre: "Servicio gravado 1,000 más IVA 160", fecha: "2026-06-30", entradas: {gravado: "1000", iva: "160"}, esperado: "D clientes 1160.00; H ingreso_gravado 1000.00; H iva_trasladado_no_cobrado 160.00"}
      - {nombre: "Honorarios a una moral con retenciones (10 % ISR y 2/3 del IVA)", fecha: "2026-06-30", entradas: {gravado: "10000", iva: "1600", isr_retenido: "1000", iva_retenido: "1066.67"}, esperado: "D clientes 9533.33; D isr_retenido_por_clientes 1000.00; D iva_retenido_por_clientes 1066.67; H ingreso_gravado 10000.00; H iva_trasladado_no_cobrado 1600.00"}
      - {nombre: "Mixto: gravado, tasa 0 y exento en una misma factura", fecha: "2026-06-30", entradas: {gravado: "800", tasa0: "200", exento: "300", iva: "128"}, esperado: "D clientes 1428.00; H ingreso_exento 300.00; H ingreso_gravado 800.00; H ingreso_tasa0 200.00; H iva_trasladado_no_cobrado 128.00"}
