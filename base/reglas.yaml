  - id: R-162
    nombre: "Actualización con INPC real (CFF 17-A) y recargos sobre el monto actualizado (CFF 21)"
    estado: NUEVA
    fase: 2
    parametros: [ACTUALIZACION_FACTOR_DECIMALES, RECARGOS_MORA_MENSUAL]
    calculadora: actualizacion_inpc
