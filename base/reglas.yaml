  # ───────────── H. Plataformas digitales (625) ─────────────
  - id: R-160
    nombre: "Plataformas digitales (625): retención de ISR e IVA, pago definitivo y sin RFC"
    estado: NUEVA
    fase: 3
    parametros: [PLATAFORMAS_ISR_PF_TABLA, PLATAFORMAS_ISR_PM_TABLA, PLATAFORMAS_IVA_RET_PCT, PLATAFORMAS_PD_TOPE_ANUAL]
    calculadora: isr_plataformas
    fuente: "LISR art. 113-A, 113-B y 113-C; LIVA art. 18-J; LIF 2026 art. 25 fr. VI (texto de la Cámara; sin cotejar con el DOF)"
    citas: [{ley: LISR, articulo: "113-a"}, {ley: LISR, articulo: "113-b"}, {ley: LISR, articulo: "113-c"}, {ley: LIVA, articulo: "18-j"}, {ley: LIF2026, articulo: "25"}]
    que_dice: "La plataforma te retiene ISR según tu actividad y la mitad del IVA; si no le das tu RFC te retiene más; esa retención es un pago provisional, salvo que optes y calificas para que sea definitivo."
    correcto_si: "Las personas físicas usan la tasa de su actividad y las personas morales la suya; sin RFC se retiene la tasa máxima de ISR y todo el IVA; la retención es definitiva solo si la persona física optó y sus ingresos del año anterior no pasaron del tope."
    hallazgo: "R-118 y PLATAFORMAS_ISR_TABLA mezclan dos casos: el 2.5 % de enajenación y servicios es de las personas morales (LIF 2026 art. 25 fr. VI); a las personas físicas la LISR 113-A les retiene 1 %. Esta regla los separa. Todos los parámetros nuevos quedan por_confirmar hasta que una persona los confirme en el DOF: el texto de la LISR trae como última reforma el 01-abr-2024; el barrido del DOF no encontró decretos posteriores y la LIF 2026 art. 25 fr. VI remite al 113-A fr. III como vigente (consistente), pero eso es evidencia, no prueba. La opción de pago definitivo exige además que la persona física solo tenga ingresos de plataformas (más salarios o intereses): eso lo valida la app, no la calculadora."
    casos:
      - {nombre: "PF transporte o entrega: 2.1 % del ingreso y 50 % del IVA", fecha: "2026-06-30", entradas: {contribuyente: pf, actividad: transporte_entrega, ingresos: "10000", iva_trasladado: "1600"}, esperado: {tasa: "2.1", isr_retenido: "210.00", iva_retenido: "800.00", pago_definitivo: "no"}}
      - {nombre: "PF hospedaje: 4 %", fecha: "2026-06-30", entradas: {contribuyente: pf, actividad: hospedaje, ingresos: "10000", iva_trasladado: "1600"}, esperado: {tasa: "4", isr_retenido: "400.00", iva_retenido: "800.00", pago_definitivo: "no"}}
      - {nombre: "PF enajenación de bienes y servicios: 1 %", fecha: "2026-06-30", entradas: {contribuyente: pf, actividad: enajenacion_servicios, ingresos: "10000", iva_trasladado: "1600"}, esperado: {tasa: "1", isr_retenido: "100.00", iva_retenido: "800.00", pago_definitivo: "no"}}
      - {nombre: "PF sin RFC: ISR al 20 % e IVA al 100 %", fecha: "2026-06-30", entradas: {contribuyente: pf, actividad: enajenacion_servicios, ingresos: "10000", iva_trasladado: "1600", con_rfc: "no"}, esperado: {tasa: "20", isr_retenido: "2000.00", iva_retenido: "1600.00", pago_definitivo: "no"}}
      - {nombre: "Definitivo en el límite: ingresos del año anterior exactamente 300,000", fecha: "2026-06-30", entradas: {contribuyente: pf, actividad: enajenacion_servicios, ingresos: "10000", iva_trasladado: "1600", opta_definitivo: "si", ingresos_ejercicio_anterior: "300000"}, esperado: {tasa: "1", isr_retenido: "100.00", iva_retenido: "800.00", pago_definitivo: "si"}}
