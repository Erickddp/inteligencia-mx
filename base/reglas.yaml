      - {nombre: "Límite: inversiones de exactamente 3,000,000 siguen en el art. 209", fecha: "2026-12-31", entradas: {monto: "1000000", tipo_bien: construcciones, inicio_uso: "2026-10-01", inversiones_ejercicio: "3000000"}, esperado: {articulo: "LISR 209", tasa: "13", monto_original: "1000000.00", meses: "3", deduccion: "32500.00"}}
      - {nombre: "Segundo año completo de la misma construcción", fecha: "2027-12-31", entradas: {monto: "1000000", tipo_bien: construcciones, inicio_uso: "2026-10-01"}, esperado: {articulo: "LISR 209", tasa: "13", monto_original: "1000000.00", meses: "12", deduccion: "130000.00"}}
      - {nombre: "Laptop de 30,000 todo el año al 50 %", fecha: "2026-12-31", entradas: {monto: "30000", tipo_bien: equipo_computo, inicio_uso: "2026-01-01"}, esperado: {articulo: "LISR 209", tasa: "50", monto_original: "30000.00", meses: "12", deduccion: "15000.00"}}
