# TIMBRA · CATÁLOGO DE REGLAS (conectado a parametros.yaml)
# Cada regla dice QUÉ parámetros usa. Así el motor sabe qué se rompe si cambia uno:
#   python motor.py impacto IVA_TASA_GENERAL
# estado: OK | REVISAR | CORREGIR | FALTA | NUEVA | LISTO_FIRMA (investigado; espera firma de Rick o una prueba real) | CRITERIO (no es ley: lo define Rick con fichas)
# fase: en qué fase se termina de investigar
# casos: los corre "python motor.py probar". confirmado:false = no cuenta como falla (espera firma o dato oficial)

version_base: "0.4.2"

reglas:

  # ───────────── A. Qué cuenta y en qué mes ─────────────
  - id: R-01
    nombre: Montos sin IVA, menos descuento, en pesos
    estado: OK
    fase: 1
  - id: R-02
    nombre: Solo CFDI vigentes; REP no suma a ingresos ni gastos
    estado: OK
    fase: 1
  - id: R-03
    nombre: Mes del CFDI y de la factura global (InformacionGlobal)
    estado: CORREGIR
    fase: 2
    parametros: [CFDI_GLOBAL_HORAS_MAX]
    fuente: "RMF 2026 regla 2.7.1.21"
    hallazgo: "La global se timbra dentro de las 24 horas siguientes al cierre del periodo; el ingreso es del periodo amparado aunque se timbre tarde (eso es infracción, no cambio de mes). Bimestral (13-18) solo con facilidad expresa: bloquear si el emisor no la tiene. Quitar el 'máximo 12 meses atrás': no tiene fundamento; poner AVISO de extemporánea cuando pasen las 24 h."
  - id: R-04
    nombre: Facturado a cuenta de terceros no es ingreso del mandatario
    estado: OK
    fase: 1
  - id: R-05
    nombre: Sin obligación antes de la constitución ni en meses futuros
    estado: OK
    fase: 1

  # ───────────── B. IVA ─────────────
  - id: R-10
    nombre: IVA a flujo (PUE al emitir; PPD con REP)
    estado: CORREGIR
    fase: 2
    fuente: "LIVA arts. 1-B y 5 fr. III; LISR art. 102 (PF acumulan al cobrar)"
    hallazgo: "El cobro cuenta en el mes de la FECHA DE PAGO del REP, no en el de su emisión. Hoy Fiscal y DIOT usan emisión y el Inicio usa FechaPago: tres pantallas, dos criterios. Aplica a IVA de todos y a ISR de regímenes de flujo (612, 606, 626 PF/PM). La PM del 601 acumula ISR al emitir (LISR art. 17): ahí el REP no mueve ISR, solo IVA."
  - id: R-11
    nombre: IVA acreditable
    estado: OK
    fase: 2
    parametros: [DEDUCCION_EFECTIVO_TOPE]
    hallazgo: "Falta el IVA que TÚ retuviste: es acreditable solo en el mes en que lo enteras (LIVA art. 5 fr. IV). Requisitos completos: deducible para ISR, trasladado en CFDI, efectivamente pagado, retenciones enteradas."
  - id: R-12
    nombre: No deducible / no acreditable
    estado: OK
    fase: 2
    parametros: [DEDUCCION_EFECTIVO_TOPE]
    hallazgo: "Usos D01-D10 no son 'no deducibles' en una PF: son deducciones personales para la anual (art. 151). Clasificarlas aparte, no tirarlas."
  - id: R-13
    nombre: IVA a cargo del mes
    estado: CORREGIR
    fase: 1
    calculadora: iva_mes
    hallazgo: "Fórmula: trasladado cobrado - retenido a mí - acreditable (incluye lo que yo retuve y enteré) - saldo a favor anterior. Ver R-14."
    casos:
      - nombre: "Saldo a favor de diciembre se usa en enero del año siguiente"
        fecha: "2027-01-31"
        entradas: {trasladado: "5000.00", retenido_a_mi: "0.00", acreditable: "2000.00", saldo_favor_anterior: "5000.00"}
        esperado: {a_pagar: "0.00", saldo_favor_remanente: "2000.00", saldo_favor_del_mes: "0.00"}
      - nombre: "Mes con más acreditable que trasladado genera saldo nuevo"
        fecha: "2026-10-31"
        entradas: {trasladado: "1000.00", retenido_a_mi: "0.00", acreditable: "3000.00", saldo_favor_anterior: "500.00"}
        esperado: {a_pagar: "0.00", saldo_favor_remanente: "500.00", saldo_favor_del_mes: "2000.00"}
  - id: R-14
    nombre: Saldo a favor de IVA
    estado: CORREGIR
    fase: 2
    fuente: "LIVA art. 6"
    calculadora: iva_mes
    casos:
      - nombre: "Saldo pedido en devolución ya no se acredita"
        fecha: "2027-01-31"
        entradas: {trasladado: "5000.00", retenido_a_mi: "0.00", acreditable: "2000.00", saldo_favor_anterior: "5000.00", saldo_en_devolucion: "5000.00"}
        esperado: {a_pagar: "3000.00", saldo_favor_remanente: "0.00", saldo_favor_del_mes: "0.00"}
    hallazgo: "ESTABA MAL: el saldo a favor NO muere al cerrar el año. Se acredita en los meses siguientes hasta agotarlo, o se pide en devolución el TOTAL. Lo pedido en devolución ya no se acredita. Unir con R-18 y perilla P12; guardar cada saldo con su mes de origen y destino (acreditado | devolución)."
  - id: R-15
    nombre: Tasas de IVA (16, 8 frontera, 0, exento)
    estado: LISTO_FIRMA
    fase: 1
    parametros: [IVA_TASA_GENERAL, IVA_TASA_FRONTERA_NORTE]
    calculadora: parametro
    hallazgo: "El 8% es un ESTÍMULO con vigencia hasta 31-dic-2026, no una tasa de ley. Desde el 1-ene-2027 el motor ya no lo da si no se carga la prórroga publicada. Esto es justo tu ejemplo de 'el IVA cambia el próximo año'."
    casos:
      - {nombre: "8% vigente hoy", fecha: "2026-11-04", entradas: {id: IVA_TASA_FRONTERA_NORTE}, esperado: "8"}
      - {nombre: "8% sin prórroga en 2027 → aviso", fecha: "2027-01-15", entradas: {id: IVA_TASA_FRONTERA_NORTE}, espera_error: SinValor}
  - id: R-16
    nombre: Retenciones de IVA
    estado: OK
    fase: 1
    parametros: [IVA_RET_DOS_TERCIOS, IVA_RET_SERV_ESPECIALIZADOS, IVA_RET_AUTOTRANSPORTE]
    calculadora: retencion_iva
    hallazgo: "La de 2/3 ya no es un número fijo: se calcula de la tasa general. Si el IVA cambia, la retención cambia sola."
    casos:
      - {nombre: "Honorarios 10,000 a una moral", fecha: "2026-11-04", entradas: {subtotal: "10000.00", parametro: IVA_RET_DOS_TERCIOS}, esperado: "1066.67"}
      - {nombre: "Servicios especializados 10,000", fecha: "2026-11-04", entradas: {subtotal: "10000.00", parametro: IVA_RET_SERV_ESPECIALIZADOS}, esperado: "600.00"}
  - id: R-17
    nombre: Proporción de IVA acreditable con actividades exentas o no objeto
    estado: NUEVA
    fase: 2
    calculadora: proporcion_iva
    fuente: "LIVA art. 5 fr. V incisos c) y d), 4-A, 5-B y 5-C"
    hallazgo: "Gasto solo para gravadas (16% o 0%): 100%. Solo para exentas o no objeto: 0%. Indistinto: (16% + 0%) / (16% + 0% + exentas + no objeto). Desde 2022 los actos no objeto entran al denominador. Fuera del cálculo, lo del art. 5-C (ventas de activo fijo, intereses, acciones, moneda, etc.). Opción 5-B: usar la proporción del año anterior por 60 meses (perilla P8 = 'mensual' o '5-B' + proporción). Se necesita clasificar cada gasto: gravada / exenta / indistinto."
    casos:
      - nombre: "800 mil al 16%, 200 mil al 0%, 300 mil exentas, 200 mil no objeto; IVA indistinto 30 mil"
        fecha: "2026-10-31"
        entradas: {gravadas_16: "800000.00", gravadas_0: "200000.00", exentas: "300000.00", no_objeto: "200000.00", iva_indistinto: "30000.00"}
        esperado: "20000.00"
      - nombre: "Solo gravadas al 16% y exentas: 60% (600 mil de 1 millón); IVA indistinto 12,500"
        fecha: "2026-10-31"
        entradas: {gravadas_16: "600000.00", gravadas_0: "0.00", exentas: "400000.00", no_objeto: "0.00", iva_indistinto: "12500.00"}
        esperado: "7500.00"
      - nombre: "Límite: sin exentas ni no objeto es 100% y se acredita todo"
        fecha: "2026-10-31"
        entradas: {gravadas_16: "500000.00", gravadas_0: "0.00", exentas: "0.00", no_objeto: "0.00", iva_indistinto: "9999.99"}
        esperado: "9999.99"
      - nombre: "Redondeo: un tercio de 10,000 es 3,333.33"
        fecha: "2026-10-31"
        entradas: {gravadas_16: "1000000.00", gravadas_0: "0.00", exentas: "2000000.00", no_objeto: "0.00", iva_indistinto: "10000.00"}
        esperado: "3333.33"
      - nombre: "Los actos no objeto (art. 4-A) entran al denominador: 400 mil gravadas de 1 millón"
        fecha: "2026-10-31"
        entradas: {gravadas_16: "400000.00", gravadas_0: "0.00", exentas: "0.00", no_objeto: "600000.00", iva_indistinto: "5000.00"}
        esperado: "2000.00"
  - id: R-18
    nombre: Saldo a favor solicitado en devolución vs acreditado
    estado: OK
    fase: 2
    hallazgo: "Resuelto en R-14: cada saldo guarda mes de origen y destino (acreditar | devolución, siempre por el total). Lo pedido en devolución sale del arrastre."
  - id: R-19
    nombre: IVA de importaciones (pedimentos)
    estado: NUEVA
    fase: 2
    hallazgo: "El IVA pagado en aduana es acreditable en el mes en que se pagó, con el pedimento como comprobante (no hay CFDI del proveedor); el CFDI del agente aduanal ampara solo sus honorarios. Va en la DIOT en los campos de importación de tangibles (pos. 14-15, 24-25, 40-43). Captura: número de pedimento, fecha de pago, IVA pagado y DTA aparte (el DTA no causa IVA acreditable)."

  # ───────────── C. ISR por régimen ─────────────
  - id: R-20
    nombre: Provisional 612 con tarifa acumulada oficial
    citas: [{ley: LISR, articulo: "106"}]
    que_dice: "En el 612, el pago provisional de febrero a noviembre se calcula con la tabla acumulada oficial del Anexo 8, no con la tarifa mensual multiplicada por los meses."
    correcto_si: "Enero usa la tarifa mensual, febrero a noviembre la tabla acumulada oficial del mes y diciembre la tarifa anual."
    estado: OK
    fase: 3
    parametros: [ISR_TARIFA_MENSUAL, ISR_TARIFA_ACUMULADA_106, ISR_TARIFA_ANUAL]
    calculadora: isr_art96_acumulada
    fuente: "LISR art. 106; Anexo 8 RMF 2026 apartado B fr. VI (PDF oficial)"
    hallazgo: "Resuelto con el PDF oficial: enero = mensual, febrero a noviembre = tablas acumuladas publicadas, diciembre = anual. Derivar multiplicando daba 1 centavo menos (el SAT usa límite superior × meses; febrero inicia en 283,761.33 y su cuota es 74,019.38)."
    casos:
      - {nombre: "Febrero, base 300,000 (tabla oficial)", fecha: "2026-02-28", entradas: {base: "300000.00", meses: 2}, esperado: "79540.53"}
      - {nombre: "Junio, base 120,000", fecha: "2026-06-30", entradas: {base: "120000.00", meses: 6}, esperado: "14301.92"}
      - {nombre: "Diciembre = tarifa anual", fecha: "2026-12-31", entradas: {base: "470000.00", meses: 12}, esperado: "78717.86"}
  - id: R-21
    nombre: Provisional 606 arrendamiento
    estado: CORREGIR
    fase: 3
    parametros: [ARREND_DEDUCCION_CIEGA_PCT, ARREND_TRIMESTRAL_VECES_UMA, ISR_RET_ARRENDAMIENTO_PM, ISR_TARIFA_MENSUAL, UMA_MENSUAL]
    hallazgo: "Falta: predial en la ciega (35% + predial) y la opción de pagos trimestrales cuando las rentas del mes no pasan de 10 UMA mensuales (art. 116)."
  - id: R-22
    nombre: RESICO PF pago mensual
    citas: [{ley: LISR, articulo: "113-e"}]
    que_dice: "El RESICO de personas físicas paga una tasa sobre lo cobrado en el mes, y esa tasa sube conforme sube el cobrado mensual."
    correcto_si: "La tasa corresponde al tramo del cobrado del mes y se aplica a todo lo cobrado; son pagos definitivos mientras no se rebase el tope anual del régimen."
    estado: OK
    fase: 1
    parametros: [RESICO_PF_TABLA, RESICO_PF_TOPE_ANUAL, RESICO_PF_RETENCION_PM]
    calculadora: resico_pf_mensual
    hallazgo: "Tasas verificadas (art. 113-E). Son pagos definitivos; la RMF 2026 releva de la anual si cumple. En 2027 viene propuesta de tope 5 M e IVA opcional 7%: ya están cargados como 'propuesta' y NO se aplican hasta el DOF."
    casos:
      - {nombre: "20,000", fecha: "2026-06-30", entradas: {ingreso: "20000.00"}, esperado: "200.00"}
      - {nombre: "Límite exacto 25,000", fecha: "2026-06-30", entradas: {ingreso: "25000.00"}, esperado: "250.00"}
      - {nombre: "Un centavo arriba: brinca a 1.10% sobre TODO", fecha: "2026-06-30", entradas: {ingreso: "25000.01"}, esperado: "275.00"}
      - {nombre: "300,000 en el mes", fecha: "2026-06-30", entradas: {ingreso: "300000.00"}, esperado: "7500.00"}
  - id: R-23
    nombre: RESICO PM provisional
    estado: REVISAR
    fase: 3
    parametros: [ISR_PM_TASA, RESICO_PM_TOPE_ANUAL]
    hallazgo: "Faltan PTU pagada y pérdidas por amortizar (perilla P10)."
  - id: R-24
    nombre: 601 provisional con coeficiente de utilidad
    estado: REVISAR
    fase: 3
    parametros: [ISR_PM_TASA]
    hallazgo: "El coeficiente (P9) debe guardarse en servidor por ejercicio, no en el navegador."
  - id: R-25
    nombre: 605 / deducciones personales
    estado: OK
    fase: 1
    parametros: [DED_PERS_VECES_UMA_ANUAL, DED_PERS_PCT_INGRESO, UMA_ANUAL]
    calculadora: tope_deducciones_personales
    casos:
      - {nombre: "Ingreso 1,000,000: manda el 15%", fecha: "2026-12-31", entradas: {ingreso_total: "1000000.00"}, esperado: "150000.00"}
      - {nombre: "Ingreso 2,000,000: manda 5 UMA anuales", fecha: "2026-12-31", entradas: {ingreso_total: "2000000.00"}, esperado: "213973.20"}
  - id: R-26
    nombre: Tarifa art. 96 y UMA 2026
    estado: CORREGIR
    fase: 1
    parametros: [ISR_TARIFA_MENSUAL, UMA_DIARIA, UMA_MENSUAL, UMA_ANUAL]
    calculadora: isr_art96_mensual
    hallazgo: "Tu catálogo traía límites y tasas SIN cuotas fijas. Ya está completa del Anexo 8 RMF 2026, más la de 2023-2025. La UMA nueva rige desde 1-feb: el repo busca la UMA por AÑO (tarifas.uma, umaDe) y en enero de 2026 usó la de 2026: error. Siempre por fecha."
    casos:
      - {nombre: "Base 15,000 en 2025 (tarifa 2023-2025)", fecha: "2025-06-30", entradas: {base: "15000.00"}, esperado: "1552.78"}
      - {nombre: "Tarifa en enero 2027 sin Anexo 8 nuevo → estimación", fecha: "2027-01-31", calculadora: estado_parametro, entradas: {id: ISR_TARIFA_MENSUAL}, esperado: "arrastrado"}
      - {nombre: "Base 15,000", fecha: "2026-03-31", entradas: {base: "15000.00"}, esperado: "1402.82"}
      - {nombre: "Base 25,000", fecha: "2026-03-31", entradas: {base: "25000.00"}, esperado: "3451.65"}
      - {nombre: "Base 120,000", fecha: "2026-03-31", entradas: {base: "120000.00"}, esperado: "30007.87"}
      - {nombre: "Frontera entre renglón 1 y 2 (sin brinco)", fecha: "2026-03-31", entradas: {base: "844.59"}, esperado: "16.22"}
  - id: R-27
    nombre: Vencimiento día 17 y días extra por sexto dígito del RFC
    estado: LISTO_FIRMA
    fase: 2
    parametros: [DIA_VENCIMIENTO_MENSUAL, DIAS_EXTRA_SEXTO_DIGITO]
    calculadora: dias_extra_sexto_digito
    hallazgo: "Fundamento: Decreto DOF 26-dic-2013 art. 5.1, de 1 a 5 días HÁBILES después del 17 (contando desde el 17 ya recorrido por CFF 12). No aplica a grandes contribuyentes ni a quien dictamina. Requiere el calendario de días hábiles que ya tiene el repo (es_habil). Guardar en el perfil si el cliente está excluido."
    casos:
      - {nombre: "PF GOMA850317H23: sexto dígito 7", fecha: "2026-11-04", entradas: {rfc: "GOMA850317H23"}, esperado: "4"}
      - {nombre: "PM ABC970528UHA: sexto dígito 8", fecha: "2026-11-04", entradas: {rfc: "ABC970528UHA"}, esperado: "4"}
      - {nombre: "PF con fecha terminada en 1", fecha: "2026-11-04", entradas: {rfc: "XOJI740911U48"}, esperado: "1"}
  - id: R-28
    nombre: 625 plataformas y 621
    estado: REVISAR
    fase: 3
    hallazgo: "2026 cambió: retenciones de plataformas ya alcanzan a personas morales y hay nuevos supuestos de retención 100% de IVA (LIVA 18-J). Investigar tasas LIF 2026."

  # ───────────── D. DIOT ─────────────
  - id: R-30
    nombre: "DIOT: layout y criterio de pagado"
    estado: LISTO_FIRMA
    fase: 2
    parametros: [DIOT_NUM_CAMPOS, DIOT_LAYOUT_2025]
    calculadora: diot_renglon
    hallazgo: "Layout oficial cargado campo por campo (54) del instructivo del SAT de enero 2025: 7 del tercero, 10 de valor de actos (norte, sur, 16%, importación tangibles, importación intangibles, cada uno con devoluciones), 10 de IVA acreditable (exclusivo y con proporción), 20 de IVA no acreditable (proporción, no cumple requisitos, exentas, no objeto), 6 adicionales y el manifiesto 01/02. Montos enteros. El 8% de frontera va en su propio grupo (pos. 8-9, 18-19, 28-31), no revuelto con el 16%. Único pendiente: confirmar sin pipe final con una carga real."
    casos:
      - nombre: "Proveedor nacional con 10,000 al 16% arma 54 campos"
        fecha: "2026-10-31"
        entradas: {tipo_tercero: "04", tipo_operacion: "85", rfc: "AAA010101AAA", valor_16: "10000", iva_acred_excl_16: "1600", manifiesto_efectos: "01"}
        esperado: "54"
  - {id: R-31, nombre: "DIOT: no acreditable y 69-B", estado: OK, fase: 1}
  - id: R-32
    nombre: "DIOT: tipo de tercero y tipo de operación"
    estado: CORREGIR
    fase: 2
    hallazgo: "Ya no 'todo como nacional': 04 nacional (operaciones 02, 03, 06, 08, 85), 05 extranjero (02, 03, 07; con número de identificación fiscal, nombre y país), 15 global con XAXX010101000 y operación 87. Los extranjeros sin RFC NO se sacan con aviso: se declaran como 05."

  # ───────────── E-F. Gastos y bancos ─────────────
  - {id: R-40, nombre: "Sugerencia de deducible", estado: CRITERIO, fase: 2}
  - {id: R-41, nombre: "EFOS 69-B", estado: OK, fase: 1}
  - {id: R-50, nombre: "Conciliar 1 movimiento ↔ 1 CFDI", estado: OK, fase: 1}
  - {id: R-51, nombre: "Cuadre de saldos del estado de cuenta", estado: OK, fase: 1}
  - id: R-52
    nombre: Dólares y tipo de cambio
    estado: OK
    fase: 2
    parametros: [TIPO_CAMBIO_REGLA, BANXICO_SERIE_TC_CFF20]
    calculadora: tipo_cambio_dof_anterior
    fuente: "CFF art. 20, tercer párrafo; Banxico SIE SF43718 y SF60653"
    hallazgo: "CFF 20: el tipo de cambio que Banxico publica en el DOF el día ANTERIOR a la operación. El DOF publica el FIX determinado el día hábil bancario previo, así que la regla es el SEGUNDO FIX determinado antes de la fecha. Verificado contra la serie SF60653 de Banxico (fecha de liquidación) en 675 días (2025-01-01 a 2026-11-06) con 0 diferencias, incluidos fines de semana y el puente del 2-nov-2026 (evidencia en fuentes/evidencia/tc_cff20, recalculada de forma independiente). Para el CFDI manda el TipoCambio que trae el comprobante; para pagos en dólares el del REP (TipoCambioP). Diferencias entre TC de factura y de pago = ganancia o pérdida cambiaria (resultado), no ingreso por ventas."
    casos:
      - {nombre: "Martes normal: dos FIX atrás", fecha: "2026-11-05", entradas: {fix: {"2026-10-28": "18.6673", "2026-10-29": "18.8148", "2026-10-30": "18.7962", "2026-11-03": "18.7592", "2026-11-04": "18.6285", "2026-11-05": "18.7147"}}, esperado: "18.7592"}
      - {nombre: "Día siguiente a un FIX faltante (puente del 2-nov)", fecha: "2026-11-03", entradas: {fix: {"2026-10-28": "18.6673", "2026-10-29": "18.8148", "2026-10-30": "18.7962", "2026-11-03": "18.7592", "2026-11-04": "18.6285", "2026-11-05": "18.7147"}}, esperado: "18.8148"}
      - {nombre: "Día del puente sin FIX propio", fecha: "2026-11-02", entradas: {fix: {"2026-10-28": "18.6673", "2026-10-29": "18.8148", "2026-10-30": "18.7962", "2026-11-03": "18.7592", "2026-11-04": "18.6285", "2026-11-05": "18.7147"}}, esperado: "18.8148"}
      - {nombre: "Sin dos FIX previos no hay valor", fecha: "2026-10-29", entradas: {fix: {"2026-10-28": "18.6673"}}, espera_error: SinValor}
  - id: R-53
    nombre: Depósito sin CFDI / pago sin CFDI
    estado: OK
    fase: 2
    hallazgo: "Depósitos en cuenta no registrados en contabilidad se presumen ingresos (CFF 59 fr. III); en PF además está la discrepancia fiscal (LISR 91). Pago sin CFDI: no deducible ni acreditable (LISR 27 fr. XVIII; LIVA 5 fr. II). Avisar, no reclasificar solo."
  - id: R-54
    nombre: Clasificación de movimientos por cliente
    estado: CRITERIO
    fase: 2
    hallazgo: "No es ley: es criterio del contador por cliente. Se resuelve con la FICHA DE CLASIFICACIÓN (perilla P21) guardada por RFC, con prioridad sobre lo aprendido; cada regla con quién la firmó."

  # ───────────── G-H. Contabilidad y estados ─────────────
  - id: R-60
    nombre: Póliza de diario por CFDI
    estado: OK
    fase: 2
