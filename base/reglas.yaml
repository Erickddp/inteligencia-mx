      - {nombre: "Paga 20-nov-2026: ya se usa el INPC de oct-2026 (DOF 10-nov-2026)", fecha: "2026-11-20", entradas: {monto: "10000", desde: "2026-01-17", hasta: "2026-11-20"}, esperado: {inpc_antiguo: "2025-12 143.042", inpc_reciente: "2026-10 147.026", factor: "1.0279", actualizacion: "279.00", monto_actualizado: "10279.00"}}
