  - id: R-173
    nombre: "Porciento máximo de deducción por bien, actividad o diferido (arts. 33 a 35)"
    estado: NUEVA
    fase: 3
    parametros: [DEPRECIACION_TASAS_ART34, DEPRECIACION_TASAS_ART35, DEPRECIACION_TASAS_ART33, DEPRECIACION_CONTABLE_REFERENCIA]
    calculadora: tasa_depreciacion
    fuente: "LISR arts. 33, 34 y 35; NIF C-6 para la tasa contable (CRITERIO)"
    citas: [{ley: LISR, articulo: "33"}, {ley: LISR, articulo: "34"}, {ley: LISR, articulo: "35"}, {nif: "C-6"}]
    que_dice: "Dice qué porcentaje máximo de deducción fiscal le toca a un bien: primero se busca por tipo de bien (art. 34); si es maquinaria que no está ahí, por la actividad en que se usa (art. 35); los diferidos, en el art. 33."
    correcto_si: "La tasa y el artículo coinciden con la fracción que describe el bien; la tasa contable es aparte (vida útil, NIF C-6) y DEPRECIACION_CONTABLE_REFERENCIA sólo da una referencia y la clave fiscal de cada tipo de activo de la app."
    hallazgo: "Las tasas contables NO salen de ninguna ley: la NIF C-6 pide la vida útil estimada por la entidad. DEPRECIACION_CONTABLE_REFERENCIA queda por_confirmar a propósito y trae la clave fiscal de cada tipo de activo de Timbra para que deje de tener tasas escritas a mano. Ojo: Timbra traía 25 % para equipo satelital; el art. 34 fr. XI da 8 % (en el espacio) y 10 % (en tierra)."
