      - {nombre: "Límite: la utilidad es exactamente igual a las pérdidas; el resultado fiscal es cero", fecha: "2026-12-31", entradas: {ingresos_acumulables: "500000", deducciones_autorizadas: "400000", perdidas_anteriores: "100000"}, esperado: {utilidad_fiscal: "100000.00", resultado_fiscal: "0.00", isr: "0.00", a_cargo: "0.00", saldo_a_favor: "0.00", perdidas_por_amortizar: "0.00"}}
      - {nombre: "Pérdida del ejercicio: se suma a las anteriores y los provisionales quedan a favor", fecha: "2026-12-31", entradas: {ingresos_acumulables: "300000", deducciones_autorizadas: "450000", perdidas_anteriores: "50000", pagos_provisionales: "5000"}, esperado: {utilidad_fiscal: "-150000.00", resultado_fiscal: "0.00", isr: "0.00", a_cargo: "0.00", saldo_a_favor: "5000.00", perdidas_por_amortizar: "200000.00"}}
