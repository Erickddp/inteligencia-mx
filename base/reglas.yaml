  - id: R-172
    nombre: "Deducción de inversiones en RESICO personas morales (art. 209)"
    estado: NUEVA
    fase: 3
    parametros: [RESICO_PM_INVERSIONES, RESICO_PM_INVERSIONES_TOPE, DEPRECIACION_TASAS_ART34, AUTO_TOPE_DEDUCCION]
    calculadora: inversion_resico_pm
    fuente: "LISR arts. 31, 32, 36, 208 fr. IV, 209, 210 fr. I y 211"
    citas: [{ley: LISR, articulo: "209"}, {ley: LISR, articulo: "210"}, {ley: LISR, articulo: "211"}, {ley: LISR, articulo: "31"}, {ley: LISR, articulo: "32"}, {ley: LISR, articulo: "36"}]
    que_dice: "Una persona moral en RESICO deduce sus inversiones con los porcentajes propios del art. 209 (construcciones 13 %, cómputo 50 %...), siempre que lo invertido en el año no pase de 3 millones; si pasa, usa los del art. 34. Se deduce desde el primer mes completo de uso y el terreno no se deduce."
    correcto_si: "La tasa sale del art. 209 cuando las inversiones del ejercicio no pasan de 3,000,000 (si pasan, del art. 34); se descuenta el terreno; se cuentan meses completos de uso dentro del ejercicio; los autos se topan con el art. 36."
    hallazgo: "El capítulo XII no prevé deducción inmediata: el art. 209 sustituye los porcientos del título II. Si un decreto de deducción inmediata (p. ej. Plan México) alcanza a la RESICO PM: POR CONFIRMAR. El art. 210 fr. I permite deducir en el ejercicio en que se empieza a usar o en el siguiente; el art. 211 la lleva a los pagos provisionales: aquí se toma la parte proporcional acumulada al mes (CRITERIO). El terreno no se demerita (art. 32) y no se deduce como inversión. La reforma 2027 aprobada (tope RESICO PM de 50 M) no toca, hasta donde se sabe, el tope de 3 M del art. 209: POR CONFIRMAR con el DOF."
    casos:
      - {nombre: "Construcción 1,000,000 que se empieza a usar el 1-oct-2026: anual al 13 % por 3 meses", fecha: "2026-12-31", entradas: {monto: "1000000", tipo_bien: construcciones, inicio_uso: "2026-10-01"}, esperado: {articulo: "LISR 209", tasa: "13", monto_original: "1000000.00", meses: "3", deduccion: "32500.00"}}
