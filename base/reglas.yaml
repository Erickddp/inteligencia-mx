  # ───────────── K. Factura global, servicios médicos, retención RESICO y comisión de la terminal (pedido 02 de Timbra) ─────────────
  - id: R-165
    nombre: "Factura global: periodicidades por régimen, cómo se detalla y plazo de emisión"
    estado: NUEVA
    fase: 3
    parametros: [GLOBAL_PERIODICIDAD_POR_REGIMEN, CFDI_GLOBAL_HORAS_MAX]
    calculadora: factura_global
    fuente: "RMF 2026 regla 2.7.1.21 y 2.7.1.45; CFF art. 29-A (texto del DOF sin revisión humana)"
    citas: [{ley: RMF, anio: "2026", articulo: "2.7.1.21"}, {ley: RMF, anio: "2026", articulo: "2.7.1.45"}, {ley: CFF, articulo: "29-a"}]
    que_dice: "Las ventas al público en general se pueden amparar con un CFDI global diario, semanal o mensual, que se envía a más tardar 24 horas después del cierre del periodo; quien seguía en el RIF puede hacerlo bimestral, y RESICO PF lleva en el del mes solo el monto total."
    correcto_si: "El RFC del receptor es el genérico XAXX010101000; la periodicidad es una de las permitidas para el régimen; el detalle es por operación (con su folio) salvo RESICO PF y RIF, que llevan solo el monto total; el IVA y el IEPS van separados; y se envía dentro de las 24 horas siguientes al cierre del periodo."
    hallazgo: "Corrige un supuesto: la periodicidad BIMESTRAL no es de RESICO PF sino de quienes siguen como RIF (régimen 621, Disposiciones Transitorias de la LISR). Para RESICO PF (626) el texto exige únicamente el monto total en el CFDI de las operaciones del mes; no dice expresamente que no pueda ser diario o semanal, así que `exclusivo: si` es una interpretación que debe confirmar un contador. NO verificado, porque el Anexo 20 y su guía de llenado no están en la biblioteca: si el desglose por tasa obliga a un concepto por ticket o permite agrupar por tasa. La regla 2.7.1.21 solo exige que se separe el IVA e IEPS a cargo."
    casos:
      - {nombre: "Régimen general, mensual: permitida y por operación", fecha: "2026-06-30", entradas: {regimen: "601", periodicidad: mensual}, esperado: {permitida: "si", detalle: por_operacion, plazo_horas: "24"}}
      - {nombre: "Régimen general, bimestral: no permitida", fecha: "2026-06-30", entradas: {regimen: "601", periodicidad: bimestral}, esperado: {permitida: "no", detalle: "", plazo_horas: "24"}}
      - {nombre: "RIF (621), bimestral: permitida con solo el monto total", fecha: "2026-06-30", entradas: {regimen: "621", periodicidad: bimestral}, esperado: {permitida: "si", detalle: monto_total, plazo_horas: "24"}}
      - {nombre: "RIF (621), diaria: también vale lo general", fecha: "2026-06-30", entradas: {regimen: "621", periodicidad: diario}, esperado: {permitida: "si", detalle: por_operacion, plazo_horas: "24"}}
      - {nombre: "RESICO PF (626), mensual: solo el monto total", fecha: "2026-06-30", entradas: {regimen: "626", periodicidad: mensual}, esperado: {permitida: "si", detalle: monto_total, plazo_horas: "24"}}
      - {nombre: "RESICO PF (626), semanal: no se documenta como permitida", fecha: "2026-06-30", entradas: {regimen: "626", periodicidad: semanal}, esperado: {permitida: "no", detalle: "", plazo_horas: "24"}}
      - {nombre: "RESICO PF (626), bimestral: no permitida", fecha: "2026-06-30", entradas: {regimen: "626", periodicidad: bimestral}, esperado: {permitida: "no", detalle: "", plazo_horas: "24"}}
