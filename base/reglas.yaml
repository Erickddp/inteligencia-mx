      - {nombre: "Maquinaria de restaurante: 20 % del art. 35", fecha: "2026-12-31", entradas: {tipo_bien: maquinaria_restaurantes}, esperado: {tasa: "20", articulo: "LISR 35"}}
      - {nombre: "Maquinaria en actividad no especificada: 10 % del art. 35", fecha: "2026-12-31", entradas: {tipo_bien: maquinaria_otras_actividades}, esperado: {tasa: "10", articulo: "LISR 35"}}
      - {nombre: "Regalías: 15 % del art. 33", fecha: "2026-12-31", entradas: {tipo_bien: regalias_asistencia_otros_diferidos}, esperado: {tasa: "15", articulo: "LISR 33"}}
      - {nombre: "Equipo satelital en tierra: 10 %, no 25 %", fecha: "2026-12-31", entradas: {tipo_bien: satelital_tierra}, esperado: {tasa: "10", articulo: "LISR 34"}}
