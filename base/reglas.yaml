      - {nombre: "Límite: 1.25 % de 0.80 son 0.01", fecha: "2026-06-30", entradas: {monto: "0.80", receptor: persona_moral}, esperado: "0.01"}
  - id: R-171
    nombre: "Póliza tipo: cobro con tarjeta (la terminal deposita neto de comisión)"
    estado: CRITERIO
    fase: 4
    calculadora: poliza_cobro_terminal
    fuente: "LIVA art. 5 fr. II; LISR art. 27; CFF art. 28; NIF B-3 (referencia)"
    citas: [{ley: LIVA, articulo: "5"}, {ley: LISR, articulo: "27"}, {ley: CFF, articulo: "28"}, {nif: "B-3"}]
    que_dice: "Cuando cobras con tarjeta, la terminal te deposita el cobro menos su comisión: el ingreso va por el bruto, la comisión es un gasto y el IVA de la comisión se acredita solo si el banco te da su CFDI."
    correcto_si: "La póliza cuadra; el cliente se salda por el bruto y el banco recibe el neto; la comisión va a comisiones bancarias; el IVA de la comisión es acreditable solo con CFDI del banco, y sin él se queda en el gasto."
    hallazgo: "El concepto `comisiones_bancarias` apunta al código agrupador 701.10 del SAT («Comisiones bancarias»). El requisito de contar con el CFDI del banco para acreditar el IVA y deducir la comisión sale de LIVA 5 fr. II y LISR 27; la regla específica sobre las comisiones de terminales no está en la biblioteca."
