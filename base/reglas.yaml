    citas: [{ley: CFF, articulo: "17-a"}, {ley: CFF, articulo: "21"}]
    que_dice: "Lo que pagas tarde se actualiza con el INPC del mes anterior al del pago entre el del mes anterior al del vencimiento, y sobre esa cantidad actualizada se calculan los recargos."
    correcto_si: "El factor nunca baja de 1; si el índice del mes anterior al pago aún no se publica se usa el último publicado; los recargos se calculan sobre el monto ya actualizado."
    hallazgo: "El número de decimales del factor (cuatro) sigue por_confirmar. La serie viaja en el paquete de pip, en el repo y en el paquete plano del release como series/inpc.yaml (en el release, el asset se llama series_inpc.yaml): el contrato es 4 archivos + series/*.yaml, y el motor la busca en series/ junto a motor.py. Para fechas anteriores a oct-2021 no hay INPC cargado y la calculadora avisa en lugar de inventar."
