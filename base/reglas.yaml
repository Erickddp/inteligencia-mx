      - {nombre: "Sin CFDI del banco: el IVA de la comisión se queda en el gasto", fecha: "2026-06-30", entradas: {bruto: "1000", comision: "25", iva_comision: "4", con_cfdi_banco: "no"}, esperado: "D bancos 971.00; D comisiones_bancarias 29.00; H clientes 1000.00"}
