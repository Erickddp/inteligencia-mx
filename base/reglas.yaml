    citas: [{ley: LISR, articulo: "9"}, {ley: LISR, articulo: "14"}, {ley: LISR, articulo: "57"}]
    que_dice: "La persona moral resta de sus ingresos acumulables las deducciones y la PTU pagada, luego las pérdidas de años anteriores, y al resultado fiscal le aplica la tasa; después acredita los pagos provisionales y las retenciones del año."
    correcto_si: "La utilidad fiscal resta deducciones y PTU pagada; las pérdidas anteriores solo bajan la utilidad y nunca la vuelven negativa; el ISR sale de la tasa de personas morales sobre el resultado fiscal; lo acreditable (pagos provisionales y retenciones) puede dar impuesto a cargo o saldo a favor."
    hallazgo: "Reemplaza el renglón de R-104 para personas morales. Límites: `perdidas_anteriores` debe entrar ya actualizada y dentro de los diez ejercicios (LISR 57; la app lo valida); no modela el ajuste anual por inflación, la renta gravable de la PTU (LISR 9 último párrafo) ni el impuesto por dividendos (LISR 10). Pendiente ubicar el párrafo expreso que acredita los pagos provisionales contra el impuesto anual: hoy se apoya en LISR 14, que los hace acreditables."
