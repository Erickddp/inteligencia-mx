    estado: NUEVA
    fase: 3
    parametros: [PLATAFORMAS_ISR_PF_TABLA, PLATAFORMAS_ISR_PM_TABLA, PLATAFORMAS_IVA_RET_PCT, PLATAFORMAS_PD_TOPE_ANUAL]
    calculadora: isr_plataformas
    fuente: "LISR art. 113-A, 113-B y 113-C; LIVA art. 18-J; LIF 2026 art. 25 fr. VI (texto de la Cámara; sin cotejar con el DOF)"
    citas: [{ley: LISR, articulo: "113-a"}, {ley: LISR, articulo: "113-b"}, {ley: LISR, articulo: "113-c"}, {ley: LIVA, articulo: "18-j"}, {ley: LIF2026, articulo: "25"}]
    que_dice: "La plataforma te retiene ISR según tu actividad y la mitad del IVA; si no le das tu RFC te retiene más; esa retención es un pago provisional, salvo que optes y calificas para que sea definitivo."
    correcto_si: "Las personas físicas usan la tasa de su actividad y las personas morales la suya; sin RFC se retiene la tasa máxima de ISR y todo el IVA; la retención es definitiva solo si la persona física optó y sus ingresos del año anterior no pasaron del tope."
    hallazgo: "R-118 y PLATAFORMAS_ISR_TABLA mezclan dos casos: el 2.5 % de enajenación y servicios es de las personas morales (LIF 2026 art. 25 fr. VI); a las personas físicas la LISR 113-A les retiene 1 %. Esta regla los separa. Todos los parámetros nuevos quedan por_confirmar hasta cotejar con el DOF: el texto de la LISR en la biblioteca trae como última reforma el 01-abr-2024 y falta descartar una reforma posterior. La opción de pago definitivo exige además que la persona física solo tenga ingresos de plataformas (más salarios o intereses): eso lo valida la app, no la calculadora."
