      - nombre: "El mismo consultorio vende medicinas de patente al 0 %: la proporción no cambia"
        fecha: "2026-10-31"
        entradas: {iva_gravadas: "3200", iva_exentas: "4800", iva_indistinto: "8000", gravadas_0: "100000", exentas: "300000"}
        esperado: {proporcion: "0.2500", acreditable_gravadas: "3200.00", acreditable_indistinto: "2000.00", acreditable: "5200.00", no_acreditable: "10800.00"}
      - nombre: "Consultorio con un ultrasonido de uso indistinto: IVA 32,000 al 25 %"
