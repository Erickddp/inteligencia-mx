    calculadora: isr_606
    hallazgo: "Mensual: tarifa MENSUAL (no acumulada). Trimestral: tarifa oficial ISR_TARIFA_TRIMESTRAL_ARRENDAMIENTO (Anexo 8 2026). Según LISR 116 se puede pagar por trimestre solo quien únicamente tenga ingresos por arrendamiento y una renta mensual de hasta diez salarios mínimos elevados al mes (el texto sigue diciendo salarios mínimos; se entiende UMA, ARREND_TRIMESTRAL_VECES_UMA): la calculadora no lo valida, lo valida la app. LISR 115 dice que el 35 % es una opción EN SUBSTITUCIÓN de las demás deducciones, y que quien la ejerce puede deducir además el predial: no dice que pueda elegirse la mayor de las dos cada mes, así que usar lo mayor entre ciega y gastos reales es un criterio que decide el contador, no la ley. La retención de 10 % que hace una persona moral se acredita contra el pago provisional (LISR 116)."
    casos:
      - {nombre: "Trimestre: rentas 60,000 ciega", fecha: "2026-03-31", entradas: {ingresos: "60000.00", trimestral: true}, esperado: "3227.99"}
      - {nombre: "Renta 20,000 ciega", fecha: "2026-03-31", entradas: {ingresos: "20000.00"}, esperado: "1076.00"}
      - {nombre: "Renta 20,000 ciega + predial 1,200", fecha: "2026-03-31", entradas: {ingresos: "20000.00", predial: "1200.00"}, esperado: "924.86"}

