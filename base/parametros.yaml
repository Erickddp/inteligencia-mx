# TIMBRA · BASE DE PARÁMETROS DE LEY (fuente única de verdad)
# Fase 1 · corte 2026-11-04 · todo es orientación hasta que Rick firme (firma.validado: true)
#
# Reglas de esta base:
#  - Un parámetro NUNCA se sobreescribe: se le agrega un tramo nuevo con su vigencia (desde/hasta).
#  - Los números van como TEXTO ("117.31") para que el motor los lea como Decimal, nunca float.
#  - estado: vigente | por_confirmar (se aplican)
#            propuesta | aprobado_congreso_pendiente_dof (NUNCA se aplican salvo en simulación;
#            el motor avisa "reforma_pendiente"). Cualquier otro estado frena la carga.
#  - IDs SIN AÑO: un parámetro, varios tramos. Los importes que dependen de la UMA son fórmulas.
#  - Si un parámetro se calcula a partir de otros, lleva "formula" en lugar de "valores":
#    así, si cambia el de origen (ej. la tasa de IVA), cambian solos todos los que dependen de él.
#  - revisar_antes: fecha en la que el motor empieza a avisar que hay que confirmar si sigue igual.
#  - hasta: null + confirmado_hasta = el valor sigue vigente por ley hasta que lo reemplacen
#    (tarifa, UMA, salario mínimo, subsidio). Después de confirmado_hasta el motor lo sigue dando
#    pero marcado ARRASTRADO (estimación en pantalla), para que enero no se quede en blanco.
#    hasta con fecha = vence de verdad (estímulos con plazo, LIF anual): después da SinValor.

