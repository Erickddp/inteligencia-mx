    nota: "Mismo divisor que usa UMA_MENSUAL dentro de su fórmula; esa fórmula NO se cambia aquí (cambiarla suelta la firma de UMA_MENSUAL en Timbra). Para nómina se usa en salario mensual = SD × 30.4 y en el prorrateo del subsidio (R-82, R-126, R-128, R-140). El uso SM = SD × 30.4 es práctica del cálculo, no cita de artículo: Rick confirma antes de firmar."
