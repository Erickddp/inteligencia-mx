# TIMBRA · SERIE INPC (índice nacional de precios al consumidor, general)
# Fuente primaria: INEGI, publicado en el Diario Oficial de la Federación (CFF arts. 20 y 20-bis).
# Cada mes lleva la URL de la nota del DOF de donde se leyó. Cifras como TEXTO (Decimal en el motor, nunca float).
# Los 60 meses salen del DOF y se cruzaron contra Banxico SIE SP1 (fuentes/evidencia/inpc_banxico/): 0 diferencias.
# via: mes_publicado = nota del mes siguiente que da a conocer el índice; anexo_conceptos = nota de conceptos de consumo;
#      mes_anterior_citado = el DOF cita el índice del mes anterior en la nota del mes siguiente.
# Los textos del DOF se leyeron de TODAS las ediciones del día (matutina y vespertina); con una sola edición faltaban 11 meses.

