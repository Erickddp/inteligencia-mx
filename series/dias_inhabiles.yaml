# TIMBRA · SERIE DIAS_INHABILES (días que el SAT declara inhábiles o de vacaciones generales; CFF art. 12, 1er y 2o párrafos)
# Fuente primaria: RMF regla 2.1.6 y sus modificaciones, leídas en el Word del DOF (texto cotejado palabra por palabra el 2026-11-14).
# Los festivos de ley (sábados, domingos y las fechas del CFF 12) NO van aquí: salen del parámetro CFF_DIAS_INHABILES.
# tipo: vacaciones   = no corren plazos de trámites ante el SAT, PERO son hábiles para presentar declaraciones y pagar (CFF 12, 2o párrafo).
#       inhabil_sat  = el SAT los declara inhábiles para sus actos, trámites y procedimientos (RMF 2.1.6 fr. II).
# Después de `corte` puede haber días que el SAT aún no publica (p. ej. el segundo periodo de vacaciones de 2026, que suele salir en la RMF del año siguiente).
