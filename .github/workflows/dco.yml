name: DCO

on:
  pull_request:

permissions:
  contents: read

jobs:
  firmas:
    name: Signed-off-by en cada commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Revisar commits del PR
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          faltan=0
          for c in $(git rev-list --no-merges "$BASE_SHA..$HEAD_SHA"); do
            autor=$(git log -1 --format=%an "$c")
            case "$autor" in *"[bot]") continue;; esac   # los commits de una GitHub App no firman
            if ! git log -1 --format=%B "$c" | grep -qiE '^Signed-off-by: .+ <.+@.+>$'; then
              echo "::error::El commit $(git log -1 --format='%h %s' "$c") no trae Signed-off-by (git commit -s)"
              faltan=1
            fi
          done
          exit $faltan
